<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>GENITUS MARKET LEGENDS // Bullruns, Blasen & Raketen</title>
<style>
  :root {
    --bg: #f5f4f1;
    --bg-elevated: #ffffff;
    --bg-sunken: #ebe9e4;
    --border: #ddd9d1;
    --text: #232019;
    --text-dim: #6b6557;
    --text-faint: #a39c8a;
    --accent: #9a5b2e;
    --accent-soft: #f0e3d6;
    --chip-bg: #ebe6dc;
    --chip-text: #4a4335;
    --shadow: 0 1px 3px rgba(30,25,15,0.08), 0 1px 2px rgba(30,25,15,0.06);
    --shadow-lg: 0 12px 32px rgba(30,25,15,0.24);
    --radius: 10px;
    --radius-sm: 6px;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f;
      --bg-elevated: #211d16;
      --bg-sunken: #131110;
      --border: #372f24;
      --text: #ece6d8;
      --text-dim: #b3a890;
      --text-faint: #766c58;
      --accent: #e0954f;
      --accent-soft: #3a2c1c;
      --chip-bg: #2a2419;
      --chip-text: #d8cdb4;
      --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
      --shadow-lg: 0 20px 48px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f;
    --bg-elevated: #211d16;
    --bg-sunken: #131110;
    --border: #372f24;
    --text: #ece6d8;
    --text-dim: #b3a890;
    --text-faint: #766c58;
    --accent: #e0954f;
    --accent-soft: #3a2c1c;
    --chip-bg: #2a2419;
    --chip-text: #d8cdb4;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg: 0 20px 48px rgba(0,0,0,0.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent-soft); }

  header.top {
    position: sticky; top: 0; z-index: 30;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    padding: max(14px, env(safe-area-inset-top)) 20px 12px;
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }
  .top-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-dim); font-size: 12.5px; }
  .top-nav { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .top-nav a {
    font-size: 12px; color: var(--accent); text-decoration: none; border: 1px solid var(--border);
    padding: 5px 11px; border-radius: 100px; transition: background .15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .top-nav a:hover { background: var(--accent-soft); border-color: var(--accent); }
  .stat-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  .stat-row b { color: var(--text); font-weight: 650; }

  .tabs { display: flex; gap: 4px; margin-top: 12px; }
  .tab-btn {
    appearance: none; border: 1px solid transparent; background: transparent;
    color: var(--text-dim); font: inherit; font-size: 13px; font-weight: 600;
    padding: 7px 13px; border-radius: var(--radius-sm); cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab-btn:hover { background: var(--bg-sunken); color: var(--text); }
  .tab-btn.active { background: var(--accent-soft); color: var(--accent); }

  .controls {
    display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
    margin-top: 12px;
  }
  input[type="search"] {
    flex: 1 1 220px; min-width: 160px;
    background: var(--bg-sunken); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 8px 11px; font: inherit; font-size: 13px;
    transition: border-color .15s ease;
  }
  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  select {
    background: var(--bg-sunken); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 8px 9px; font: inherit; font-size: 13px;
    transition: border-color .15s ease;
  }
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    appearance: none; border: 1px solid var(--border); background: var(--chip-bg);
    color: var(--chip-text); font: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 11px; border-radius: 100px; cursor: pointer; white-space: nowrap;
    transition: background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .chip:hover { border-color: var(--accent); }
  .chip:active { transform: scale(.95); }
  .chip[data-active="1"] { background: var(--accent); color: #fff8ef; border-color: var(--accent); }
  .chip .n { opacity: .65; font-weight: 500; margin-left: 3px; }

  /* ---- filter drawer trigger + panel ---- */
  .filter-btn {
    appearance: none; display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); background: var(--bg-sunken); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 13px 8px 11px;
    border-radius: var(--radius-sm); cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .burger-icon { display: flex; flex-direction: column; gap: 3px; width: 15px; flex-shrink: 0; }
  .burger-icon span { display: block; height: 2px; border-radius: 1px; background: currentColor; transition: transform .2s ease; }
  .filter-badge {
    background: var(--accent); color: #fff8ef; font-size: 10.5px; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 100px; display: inline-flex;
    align-items: center; justify-content: center; padding: 0 5px; line-height: 1;
  }
  .filter-badge[hidden] { display: none; }

  .filter-backdrop {
    position: fixed; inset: 0; background: rgba(20, 16, 10, 0.35); z-index: 60;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .filter-backdrop.open { opacity: 1; pointer-events: auto; }

  .filter-drawer {
    position: fixed; top: 0; right: 0; height: 100dvh; width: 340px; max-width: 92vw;
    background: var(--bg-elevated); border-left: 1px solid var(--border); z-index: 70;
    display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
    transform: translateX(100%); transition: transform .32s cubic-bezier(.32,.72,0,1);
    padding-top: env(safe-area-inset-top); padding-right: env(safe-area-inset-right);
  }
  .filter-drawer.open { transform: translateX(0); }
  .filter-drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .filter-drawer-head h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .filter-close {
    appearance: none; border: 1px solid var(--border); background: var(--bg-sunken); color: var(--text-dim);
    width: 32px; height: 32px; border-radius: 100px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s ease, color .15s ease;
  }
  .filter-close:hover { border-color: var(--accent); color: var(--accent); }
  .filter-drawer-body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: 16px 18px;
  }
  .filter-section { margin-bottom: 22px; }
  .filter-section:last-child { margin-bottom: 0; }
  .filter-section h3 {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint);
    margin: 0 0 10px; font-weight: 700;
  }
  .filter-drawer-foot {
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .filter-reset {
    width: 100%; appearance: none; border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    font: inherit; font-size: 13px; font-weight: 600; padding: 9px; border-radius: var(--radius-sm); cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .filter-reset:hover { border-color: var(--accent); color: var(--accent); }

  main { padding: 16px 20px 60px; max-width: 1600px; margin: 0 auto; }

  .group-header {
    display: flex; align-items: baseline; gap: 10px;
    margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .group-header:first-child { margin-top: 6px; }
  .group-header .yr { font-size: 20px; font-weight: 700; }
  .group-header .mo { font-size: 13px; color: var(--text-dim); font-weight: 600; }
  .group-header .cnt { font-size: 12px; color: var(--text-faint); margin-left: auto; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px;
  }
  .card {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .18s cubic-bezier(.22,.9,.4,1), box-shadow .18s ease;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .card .thumb-wrap { aspect-ratio: 4/3; background: var(--bg-sunken); overflow: hidden; position: relative; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .meta { padding: 7px 9px 9px; }
  .card .ticker { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .company { font-size: 10.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .card .row2 { display: flex; align-items: center; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
  .badge {
    font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 100px;
    background: var(--chip-bg); color: var(--chip-text); white-space: nowrap;
  }
  .date-tag { font-size: 10px; color: var(--text-faint); margin-left: auto; }
  .date-tag.approx::after { content: " ~"; }
  .src-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; margin-right: 3px; }
  .src-chart { background: #4f9d5f; }
  .src-folder { background: #c9a227; }
  .src-approx { background: #b56a4a; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-faint); }

  /* Tab panes - gentle fade/rise whenever a pane becomes visible */
  #view-charts:not([hidden]), #view-notes:not([hidden]), #view-stats:not([hidden]) {
    animation: paneIn .22s cubic-bezier(.22,.9,.4,1);
  }
  @keyframes paneIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(10,8,5,0.82); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    opacity: 0; transition: opacity .22s ease;
  }
  .lightbox.open { opacity: 1; }
  .lightbox[hidden] { display: none; }
  .lb-panel {
    background: var(--bg-elevated); border-radius: 14px; max-width: 1100px; width: 100%;
    max-height: 92vh; display: flex; overflow: hidden; box-shadow: var(--shadow-lg);
    transform: scale(.96); transition: transform .25s cubic-bezier(.32,.72,0,1);
  }
  .lightbox.open .lb-panel { transform: scale(1); }
  .lb-img-wrap { flex: 1.4; background: var(--bg-sunken); display: flex; align-items: center; justify-content: center; min-width: 0; }
  .lb-img-wrap img { max-width: 100%; max-height: 92vh; object-fit: contain; }
  .lb-side { flex: 1; min-width: 280px; max-width: 360px; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .lb-side h2 { margin: 0 0 2px; font-size: 18px; }
  .lb-side .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }
  .lb-field { margin-bottom: 10px; }
  .lb-field .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); font-weight: 700; }
  .lb-field .v { font-size: 13px; margin-top: 2px; }
  .lb-field .v.mono { font-family: var(--mono); font-size: 11.5px; word-break: break-all; color: var(--text-dim); }
  .lb-close, .lb-nav, .lb-fullscreen {
    position: absolute; background: rgba(20,16,10,0.55); color: #fff; border: none;
    border-radius: 100px; width: 38px; height: 38px; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, transform .12s ease;
  }
  .lb-close:hover, .lb-nav:hover, .lb-fullscreen:hover { background: rgba(20,16,10,0.8); }
  .lb-close:active, .lb-nav:active, .lb-fullscreen:active { transform: scale(.92); }
  .lb-nav.prev:active { transform: translateY(-50%) scale(.92); }
  .lb-nav.next:active { transform: translateY(-50%) scale(.92); }
  .lb-close { top: max(32px, env(safe-area-inset-top)); right: max(32px, env(safe-area-inset-right)); }
  .lb-fullscreen { top: max(32px, env(safe-area-inset-top)); right: max(80px, calc(env(safe-area-inset-right) + 48px)); font-size: 16px; }
  .lb-nav.prev { left: max(32px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); }
  .lb-nav.next { right: max(32px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); }
  /* Fullscreen mode: image fills the screen edge to edge, side panel + nav tucked away */
  .lightbox:fullscreen { background: #000; }
  .lightbox:fullscreen .lb-panel { max-width: none; width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; background: #000; }
  .lightbox:fullscreen .lb-img-wrap img { max-height: 100vh; }
  .lightbox:fullscreen .lb-side { display: none; }
  .lb-conf-bar { height: 4px; border-radius: 2px; background: var(--bg-sunken); overflow: hidden; margin-top: 4px; }
  .lb-conf-fill { height: 100%; background: var(--accent); }

  /* Notes tab */
  .notes-list { display: flex; flex-direction: column; gap: 10px; max-width: 900px; margin: 0 auto; }
  .note-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .note-head {
    padding: 13px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    transition: background .15s ease;
  }
  .note-head:hover { background: var(--bg-sunken); }
  .note-title { font-weight: 650; font-size: 14px; }
  .note-path { font-size: 11px; color: var(--text-faint); font-family: var(--mono); margin-top: 2px; }
  .note-chars { font-size: 11px; color: var(--text-faint); white-space: nowrap; }
  .note-body {
    padding: 0 16px 16px; white-space: pre-wrap; font-size: 12.5px; color: var(--text-dim);
    max-height: 480px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: -1px;
  }
  .note-body[hidden] { display: none; }

  /* Stats tab */
  .stats-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
  .stat-block h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); margin: 0 0 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .bar-label { width: 170px; flex-shrink: 0; font-size: 12.5px; text-align: right; color: var(--text-dim); }
  .bar-track { flex: 1; background: var(--bg-sunken); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar-val { width: 44px; font-size: 12px; color: var(--text-faint); }

  footer {
    text-align: center; padding: 30px 20px calc(50px + env(safe-area-inset-bottom)); color: var(--text-faint); font-size: 11.5px;
  }

  /* ---- Tablet / small desktop ---- */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 9px; }
  }

  /* ---- Mobile (phones, portrait & landscape) ---- */
  @media (max-width: 720px) {
    header.top { padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: 10px; }
    h1 { font-size: 16.5px; }
    .subtitle { font-size: 11.5px; }
    .top-nav { flex-basis: 100%; margin-left: 0; }
    .top-nav a { flex: 1; text-align: center; padding: 7px 10px; }
    .stat-row { gap: 10px 14px; font-size: 11px; }
    .tabs { gap: 2px; }
    .tab-btn { padding: 7px 10px; font-size: 12.5px; }
    .controls { gap: 8px; }
    input[type="search"] { flex: 1 1 100%; font-size: 16px; } /* 16px prevents iOS Safari auto-zoom on focus */
    select { font-size: 16px; }
    .filter-btn { padding: 9px 14px 9px 12px; }
    main { padding: 12px 14px 50px; }

    .grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
    .card .meta { padding: 6px 8px 8px; }
    .card .ticker { font-size: 12px; }
    .card .company { font-size: 10px; }
    .badge { font-size: 9px; padding: 2px 5px; }
    .date-tag { font-size: 9.5px; }
    .group-header { margin: 20px 0 8px; }
    .group-header .yr { font-size: 17px; }
    .group-header .mo { font-size: 12px; }

    .lb-panel { flex-direction: column; max-height: 96vh; border-radius: 16px 16px 0 0; }
    .lb-img-wrap img { max-height: 38vh; }
    .lb-side { max-width: none; padding: 16px; }
    .lb-close { top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 36px; height: 36px; }
    .lb-nav { width: 42px; height: 42px; } /* bigger touch target for thumb reach */
    .lb-nav.prev { left: max(8px, env(safe-area-inset-left)); }
    .lb-nav.next { right: max(8px, env(safe-area-inset-right)); }

    .note-head { padding: 12px 14px; }
    .note-body { padding: 0 14px 14px; max-height: 55vh; }
    .bar-label { width: 120px; font-size: 11.5px; }
  }

  /* ---- Very small phones (iPhone SE / mini and similar) ---- */
  @media (max-width: 380px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .stat-row { display: none; } /* too dense to be useful at this width, saves scroll space */
    .filter-btn span:not(.burger-icon):not(.filter-badge) { display: none; } /* icon+badge only, no "Filter" label */
  }

  /* Respect reduced-motion preference: keep the UI functional but skip decorative motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <h1>🚀 Market Legends</h1>
    <span class="subtitle">Die größten Bullruns, Spekulationsblasen, IPO-Raketen &amp; Jahrzehnte der Börsengeschichte · EOD-Kursdaten, Kerzenmusteranalyse</span>
    <nav class="top-nav">
      <a href="../charts-bot.html">🕯 Live Charts-Bot</a>
    </nav>
  </div>
  <div class="stat-row" id="statRow"></div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="charts">Charts</button>
    <button class="tab-btn" data-tab="notes">Ereignis-Hintergrund</button>
    <button class="tab-btn" data-tab="stats">Statistik</button>
  </div>
  <div class="controls" id="chartsControls">
    <input type="search" id="searchBox" placeholder="Suche: Ticker, Firma, Ordner…">
    <select id="sortSelect">
      <option value="chrono">Chronologisch</option>
      <option value="chrono-desc">Chronologisch (neueste zuerst)</option>
      <option value="ticker">Alphabetisch (Ticker)</option>
      <option value="confidence">Konfidenz</option>
    </select>
    <button class="filter-btn" id="filterBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="filterDrawer">
      <span class="burger-icon"><span></span><span></span><span></span></span>
      <span>Filter</span>
      <span class="filter-badge" id="filterBadge" hidden>0</span>
    </button>
  </div>
</header>

<div class="filter-backdrop" id="filterBackdrop"></div>
<aside class="filter-drawer" id="filterDrawer" aria-label="Filter" aria-hidden="true">
  <div class="filter-drawer-head">
    <h2>Filter</h2>
    <button class="filter-close" id="filterCloseBtn" aria-label="Filter schließen" type="button">✕</button>
  </div>
  <div class="filter-drawer-body">
    <div class="filter-section">
      <h3 id="filterSectionGroupLabel">Kategorie</h3>
      <div class="chip-group" id="indexChips"></div>
    </div>
    <div class="filter-section">
      <h3>Chart-Typ</h3>
      <div class="chip-group" id="typeChips"></div>
    </div>
  </div>

bereinigt)","ctf":"Monatskerzen, 920 Kerzen","g":"🗓️ Jahrzehnte & Inflation (S&P 500 / Dow)","d":"1950-01-02","dsrc":"chart","conf":null,"note":"Zeitraum: 1950-01-02 bis 2026-08-03 · Veränderung: +1879.7% · Max. Drawdown: -72.8% · Signal: NEUTRAL · 461 Kerzenmuster erkannt","sz":0,"dupes":0,"analyzed":true}],"notes":[{"p":"bullrun-ED-1974","title":"Consolidated Edison — 12 Jahre aus dem Tiefpunkt der NYC-Fiskalkrise","text":"ED.US · Versorger\n\nDezember 1974: New York City steht vor dem fiskalischen Bankrott, der Dow Jones markiert sein Bärenmarkt-Tief nach dem Ölschock. Der New Yorker Versorger Con Edison notierte nahe am absoluten Pessimismus-Tiefpunkt der Ära. Von dort aus die größte Einzelrallye in diesem Datensatz — ein \"langweiliger\" Versorger, gekauft am Punkt maximaler Angst, wurde über 12 Jahre zum besten Performer.","chars":387},{"p":"bullrun-GD-1991","title":"General Dynamics — Restrukturierung nach dem Ende des Kalten Kriegs","text":"GD.US · Industrie\n\nNach dem Ende des Kalten Kriegs brach die US-Verteidigungsnachfrage ein — General Dynamics verkaufte in den frühen 1990ern radikal Sparten ab und schrumpfte sich zu einem schlanken, fokussierten Rüstungskonzern gesund. Die anschließende Rallye zeigt: ein gehasster, schrumpfender Sektor plus konsequente Restrukturierung kann über Jahre die größte Rendite liefern.","chars":364},{"p":"bullrun-GE-1990","title":"General Electric — Jack Welchs Konglomerat auf dem Höhepunkt","text":"GE.US · Industrie\n\nDie \"Welch-Ära\" GE: eine Mischung aus GE Capital, Industriesparten und aggressivem Management-Feinschliff machte General Electric zum meistbewunderten Konglomerat der 1990er. Diese Rallye ist der Kern der damaligen \"GE kann nichts falsch machen\"-Erzählung — Jahrzehnte bevor dieselbe Aktie 2008/09 fast auf null fiel.","chars":317},{"p":"bullrun-KO-1990","title":"Coca-Cola — die Buffett-These in voller Fahrt","text":"KO.US · Konsum\n\nWarren Buffett kaufte Coca-Cola 1988 und nannte es später eine seiner besten Investitionen überhaupt. Diese Rallye unter CEO Roberto Goizueta — globale Markenexpansion, Preissetzungsmacht, verlässliches Ergebniswachstum — ist im Grunde die Buffett-These live besichtigt: ein Quality-Compounder, der einfach über Jahre stetig weiterläuft.","chars":337},{"p":"bullrun-GSPC-1987","title":"S&P 500 — der längste Bullenmarkt des 20. Jahrhunderts","text":"GSPC.INDX · Index (USA)\n\nVon der Erholung nach dem Schwarzen Montag 1987 bis exakt zum Dotcom-Hoch im März 2000 — der längste ununterbrochene Bullenmarkt der Nachkriegszeit auf Indexebene. Ein guter Referenzpunkt, um Einzelwert-Raketen gegen die breite Marktbewegung derselben Periode zu spiegeln.","chars":272},{"p":"bullrun-MRK-1994","title":"Merck — Big-Pharma-Boom der 1990er","text":"MRK.US · Gesundheit\n\nDie goldene Ära der patentgeschützten Blockbuster-Medikamente, Jahre vor der Patentklippen-Problematik der 2000er: Merck profitierte wie kaum ein anderer Pharmakonzern von stetig wachsenden margenstarken Umsätzen ohne nennenswerten Generika-Druck.","chars":247},{"p":"bullrun-JNJ-1993","title":"Johnson & Johnson — diversifizierter Gesundheitskonzern im Dauerlauf","text":"JNJ.US · Gesundheit\n\nParallel zu Merck und Coca-Cola: derselbe 1990er-Bullenmarkt für breit diversifizierte, defensive Qualitätswerte. J&J zeigt, dass die Dekade nicht nur Tech-Highflyer, sondern vor allem stetig wachsende Konsum-/Gesundheitskonzerne belohnte.","chars":239},{"p":"bullrun-GE-1981","title":"General Electric — der Start der Ära Welch","text":"GE.US · Industrie\n\nJack Welch übernahm im April 1981 als CEO von GE — diese Rallye deckt fast exakt seine ersten sechs Amtsjahre ab, die \"Turnaround-These\" eines neuen, radikal leistungsorientierten Managements. Sie endet abrupt zwei Monate vor dem Schwarzen Montag 1987 — ein Lehrstück, wie plötzlich selbst die stärkste Rallye vom Gesamtmarkt gestoppt werden kann.","chars":347},{"p":"bullrun-PG-1990","title":"Procter & Gamble — Konsumgüter-Compounder der 1990er","text":"PG.US · Konsum\n\nDieselbe Konsumgüter-Bullenmarkt-Periode wie Coca-Cola — P&G profitierte von globaler Markenexpansion und stetigem Kostenmanagement. Zeigt, wie breit dieser Trend über den gesamten Konsumsektor lief, nicht nur bei einzelnen Ausreißern.","chars":235},{"p":"bullrun-XOM-1987","title":"ExxonMobil — der stille Öl-Compounder","text":"XOM.US · Energie\n\nÜber 13 Jahre, von der Erholung nach dem Schwarzen Montag bis kurz nach dem Dotcom-Hoch, compoundierte der Ölriese leise weiter, während die Schlagzeilen dem Tech-Sektor gehörten — ein Beleg dafür, dass die größten langfristigen Gewinner oft nicht die lautesten Story-Aktien sind.","chars":280},{"p":"bullrun-MRK-1984","title":"Merck — die frühere 1980er-Rallye vor Black Monday","text":"MRK.US · Gesundheit\n\nEine frühere, kürzere Merck-Rallye mitten im Bullenmarkt der mittleren 1980er — endet, wie viele Rallyes dieser Periode, kurz vor dem Schwarzen Montag 1987. Zusammen mit der späteren 1990er-Rallye (siehe oben) zeigt Merck zwei komplett unabhängige Multi-Jahres-Highflyer-Phasen derselben Aktie.","chars":294},{"p":"bullrun-BA-1963","title":"Boeing — Jet-Zeitalter-Boom der frühen 1960er","text":"BA.US · Industrie\n\nDer älteste Datenpunkt in diesem Archiv: die kommerzielle Luftfahrt expandierte in den frühen 1960ern rasant mit dem Aufkommen des Düsenzeitalters (707, 727). Boeing war der zentrale Nutznießer dieser strukturellen Nachfragewelle — eine \"Nifty-Fifty\"-benachbarte Industrieboom-Rallye, Jahrzehnte vor allen anderen Ereignissen in diesem Archiv.","chars":343},{"p":"bullrun-GE-2022","title":"General Electric — die Wiedergeburt als GE Aerospace","text":"GE.US · Industrie\n\nDer jüngste Eintrag: nach der Aufspaltung des alten Konglomerats in drei eigenständige Unternehmen (GE Aerospace, GE Vernova, GE HealthCare, abgeschlossen 2021-24) re-ratete der schlanke Luftfahrt-Pure-Play GE Aerospace dramatisch. Dieselbe Ticker-Historie wie die Welch-Ära-Rallye von 1990 oben — aber ein komplett gegensätzliches Geschäftsmodell: schlanker Fokus statt sprawelndes Konglomerat, beides rocketet.","chars":412},{"p":"bullrun-MMM-1987","title":"3M — gekauft eine Woche nach dem Schwarzen Montag","text":"MMM.US · Industrie\n\nStartpunkt dieser fast zehnjährigen Rallye: der 26. Oktober 1987 — exakt eine Woche nach dem Schwarzen Montag. Ein Lehrbuch-Beispiel dafür, wie sich der Kauf mitten im Crash-Chaos für einen soliden Industriekonzern langfristig ausgezahlt hätte.","chars":244},{"p":"bullrun-KO-1982","title":"Coca-Cola — die frühere Rallye vor der Buffett-Ära","text":"KO.US · Konsum\n\nJahre bevor Warren Buffett 1988 einstieg, lieferte Coca-Cola bereits diese frühe-1980er-Rallye — Beleg dafür, dass die Qualität des Geschäftsmodells lange vor der berühmten Investitionsentscheidung sichtbar war, für alle, die genau hinschauten.","chars":244},{"p":"obscure-NOKIA","title":"Nokia — vom Gummistiefel-Konzern zum Mobilfunk-Weltmarktführer","text":"NOKIA.HE · Mobilfunk (Finnland)\n\nNokia war in den 1980ern ein diversifizierter finnischer Mischkonzern — Gummistiefel, Kabel, Fernseher. Der radikale Fokus auf digitale GSM-Mobiltelefonie Anfang der 1990er, just als Europa auf den neuen Mobilfunkstandard umstellte, machte daraus binnen weniger Jahre den am schnellsten wachsenden Handyhersteller der Welt.","chars":323},{"p":"obscure-AGN","title":"Aegon — niederländischer Versicherungskonzern im langen 1990er-Bullenmarkt","text":"AGN.AS · Versicherung (Niederlande)\n\nKein einzelner dramatischer Auslöser, sondern 7,5 Jahre stetiges Compounding im selben globalen 1990er-Bullenmarkt, der auch die US-Blue-Chips oben trug — ein Beleg, dass diese Dekade nicht nur ein US-Phänomen war.","chars":214},{"p":"obscure-WOW","title":"Woolworths Australien — 13 Jahre Supermarkt-Dominanz","text":"WOW.AU · Einzelhandel (Australien)\n\nAustraliens dominante Supermarktkette compoundierte über mehr als ein Jahrzehnt — die Art \"langweiliges\" heimisches Handelsmonopol, das über lange Sicht oft glamourösere Wachstumsaktien schlägt.","chars":194},{"p":"obscure-ICL","title":"Israel Chemicals — Dünger-Superzyklus der 2000er","text":"ICL.TA · Chemie/Dünger (Israel)\n\nGlobaler Kali-/Dünger-Produzent, getragen vom China-getriebenen Rohstoff-Superzyklus der 2000er (steigende Nahrungsmittelnachfrage, mehr Düngereinsatz) — endet exakt am Vorabend der Finanzkrise 2008.","chars":199},{"p":"obscure-ASML","title":"ASML — Rakete Jahre bevor jeder Chip-Hersteller von ihr abhängig war","text":"ASML.AS · Halbleiter-Lithografie (Niederlande)\n\nDiese Rallye liegt Jahrzehnte bevor ASML zum praktischen Monopolisten für EUV-Lithografiemaschinen wurde, von dem heute die gesamte Chipindustrie (TSMC, Nvidia, Samsung) abhängt — schon 1996/97 war das Unternehmen eine Rakete, nur kannte außerhalb der Branche kaum jemand den Namen.","chars":282},{"p":"obscure-BBVA","title":"BBVA — spanische Bankenkonsolidierung vor dem Euro-Beitritt","text":"BBVA.MC · Banken (Spanien)\n\nSpaniens Bankensektor re-ratete kräftig in den Jahren vor dem Euro-Beitritt 1999 — Konsolidierung, sinkende Zinsen, wachsende Zuversicht in die spanische Konvergenz mit der EU-Kernwirtschaft.","chars":191},{"p":"obscure-ITX","title":"Inditex (Zara) — Fast-Fashion-Expansion nach der Finanzkrise","text":"ITX.MC · Einzelhandel (Spanien)\n\nVom Finanzkrisen-Tief aus expandierte die weltgrößte Fast-Fashion-Kette mit ihrem schnellen Lieferketten-Modell die gesamte folgende Dekade weiter global — eine der bekannteren Marken in diesem Set, aber die Aktienstory selbst bleibt vielen unbekannt.","chars":251},{"p":"obscure-ANDR","title":"Andritz — österreichischer Industrie-Compounder im Capex-Boom","text":"ANDR.VI · Industriemaschinen (Österreich)\n\nHersteller von Anlagen für Zellstoff/Papier, Wasserkraft und Stahlwerke — ein leiser Industrie-Compounder, der vom globalen Investitionsboom der mittleren 2000er profitierte.","chars":174},{"p":"obscure-KRX","title":"Kingspan — irischer Dämmstoffhersteller im Bauboom vor 2008","text":"KRX.IR · Baustoffe (Irland)\n\nIrischer Dämmstoff-/Baumaterialienhersteller, getragen vom europäischen (inklusive dem irischen eigenen) Immobilienboom vor 2008 — endet fast exakt am Vorabend der Finanzkrise.","chars":176},{"p":"obscure-WIPRO","title":"Wipro — indischer IT-Outsourcing-Boom der späten 1990er","text":"WIPRO.NSE · IT-Dienstleistungen (Indien)\n\nTeil derselben globalen Tech-Mania, die 1998/99 auch Amazon (siehe Rockets-Sektion) nach oben trieb — Indiens IT-Export-Industrie stand hier erst am Anfang ihres jahrzehntelangen Aufstiegs, verstärkt durch Y2K-Umstellungsaufträge.","chars":230},{"p":"obscure-BHARTI","title":"Bharti Airtel — Indiens Mobilfunk-Boom der frühen 2000er","text":"BHARTIARTL.NSE · Telekom (Indien)\n\nIndiens Mobilfunk-Abonnentenzahlen explodierten in den frühen 2000ern, als Handys von Luxus- zu Massenware wurden — Airtel wurde binnen weniger Jahre zum größten Telekomanbieter des Landes.","chars":189},{"p":"obscure-BAJFIN","title":"Bajaj Finance — Indiens Konsumentenkredit-Compounder der 2010er","text":"BAJFINANCE.NSE · Konsumentenkredit (Indien)\n\nEine der prägenden indischen Compounder-Geschichten der 2010er: Konsumentenkredit-Wachstum parallel zur Expansion der indischen Mittelschicht.","chars":142},{"p":"obscure-FMG","title":"Fortescue Metals — die reine Wette auf einen Eisenerz-Neuling","text":"FMG.AU · Bergbau (Australien)\n\nDie schnellste Rallye in diesem gesamten Set — reine Spekulation auf Andrew Forrests Plan, einen neuen australischen Eisenerz-Major von Grund auf aufzubauen, ganz am Anfang des China-Rohstoff-Superzyklus. Fortescue wurde später tatsächlich ein globaler Eisenerz-Major, aber dieser Kursschub lag Jahre vor der ersten Erzlieferung — reine Erwartung, kein bestätigtes Geschäft.","chars":374},{"p":"obscure-DSV","title":"DSV — vom dänischen Speditions-Regionalanbieter zum Logistikriesen","text":"DSV.CO · Logistik (Dänemark)\n\nDSV wuchs von einer regionalen dänischen Spedition fast ausschließlich durch Zukäufe zu einem der weltgrößten Logistikkonzerne — diese Rallye fängt eine der frühen akquisitionsgetriebenen Wachstumsphasen ein.","chars":208},{"p":"obscure-GEBN","title":"Geberit — der unspektakulärste Compounder der Schweizer Börse","text":"GEBN.SW · Sanitärtechnik (Schweiz)\n\nHersteller von Unterputz-Spülkästen und Sanitärsystemen — kaum ein Produkt könnte unglamouröser sein, und doch einer der verlässlichsten Qualitäts-Compounder der Schweizer Börse.","chars":178},{"p":"obscure-SOON","title":"Sonova — Hörgeräte-Compounder mit demografischem Rückenwind","text":"SOON.SW · Medizintechnik (Schweiz)\n\nSchweizer Hörgerätehersteller — ein Compounder mit klarem demografischem Rückenwind (alternde Weltbevölkerung), von dem außerhalb der Schweiz kaum jemand gehört hat.","chars":165},{"p":"obscure-FORTUM","title":"Fortum — nordischer Versorger im Emissionshandel-Re-Rating","text":"FORTUM.HE · Energieversorger (Finnland)\n\nEuropäische Strompreise re-rateten kräftig, als 2005 der EU-Emissionshandel (ETS) startete und fossile Stromerzeugung strukturell teurer wurde.","chars":143},{"p":"obscure-OMV","title":"OMV — Österreichs Öl- und Gaskonzern im selben Rohstoffzyklus","text":"OMV.VI · Öl & Gas (Österreich)\n\nÖsterreichs dominanter Öl-/Gaskonzern, getragen vom selben 2000er-Rohstoff-Superzyklus wie ICL oben.","chars":100},{"p":"obscure-ARGX","title":"argenx — belgisches Biotech, echte Studienerfolge statt Datenfehler","text":"ARGX.BR · Biotech (Belgien)\n\nAntikörper-Pipeline-Fortschritte Jahre vor der ersten Zulassung (Vyvgart, 2021) — anders als bei Datenfehlern in diesem Archiv markieren die größeren Einzeltagessprünge im Chart hier echte, öffentlich gemeldete Studienergebnistage.","chars":231},{"p":"obscure-AED","title":"Aedifica — 11 Jahre stetiges Pflegeheim-Immobilien-Compounding","text":"AED.BR · Gesundheitsimmobilien-REIT (Belgien)\n\nBelgischer REIT für Pflegeheim-Immobilien — startete exakt am Finanzkrisen-Tief und compoundierte über mehr als ein Jahrzehnt praktisch ununterbrochen weiter, eine der längsten und stetigsten Rallyes in diesem gesamten Archiv.","chars":226},{"p":"obscure-GFT","title":"GFT Technologies — deutscher IT-Nischenanbieter für Banken","text":"GFT.XETRA · IT-Beratung (Deutschland)\n\nKleiner deutscher IT-Dienstleister, spezialisiert auf Bank-Software — ritt die Welle der europäischen Banken-IT-Modernisierung nach 2011. Ein wirklich unbekannter Name außerhalb deutscher Nebenwerte-Kreise.","chars":206},{"p":"obscure-KOEI","title":"Končar-Elektroindustrija — das wohl unbekannteste Symbol dieses gesamten Archivs","text":"KOEI.ZSE · Elektrotechnik (Kroatien)\n\nKroatischer Elektrotechnik-Konzern (Transformatoren, Generatoren, Bahntechnik) — so weit abseits des Radars internationaler Investoren wie es bei einer börsennotierten Aktie nur geht, und der jüngste Eintrag unter den \"leisen Compoundern\" in diesem Set.","chars":253},{"p":"obscure-KIA","title":"Kia — vom belächelten Billig-Hersteller zur globalen Marke","text":"000270.KO · Automobil (Südkorea)\n\nKias Design-Neuausrichtung (Peter Schreyer wurde 2006 Chef-Designer) und internationale Marktanteilsgewinne nach der Finanzkrise trieben eine der großen \"vom belächelten Billig-Hersteller zur ernstzunehmenden Weltmarke\"-Neubewertungen.","chars":235},{"p":"obscure-CAP","title":"Capgemini — französischer IT-Riese im globalen 1990er-Tech-Boom","text":"CAP.PA · IT-Beratung (Frankreich)\n\nFranzösischer IT-Beratungsriese, Teil desselben globalen 1990er-IT-Dienstleistungsbooms wie Wipro oben — Y2K-Umstellungsaufträge waren gegen Ende der Dekade ein zusätzlicher Rückenwind.","chars":185},{"p":"obscure-XTB","title":"XTB — polnischer Retail-Broker im Corona-Trading-Boom","text":"XTB.WAR · Online-Broker (Polen)\n\nPolnischer Online-Broker, getragen vom selben 2020er-Retail-Trading-Boom (Lockdown-Investoren), der in den USA Robinhood nach oben trieb (siehe Bubbles-Sektion) — die schnellste und jüngste Rallye in diesem obskuren Set.","chars":220},{"p":"bubble-ZIM","title":"ZIM Integrated Shipping — Container-Fracht-Übergewinn und Rückabwicklung","text":"ZIM.US · Container-Shipping\n\nZIM ging 2021 mitten im pandemiebedingten Container-Frachtraten-Rekordboom an die Börse und zahlte 2021-22 gigantische Sonderdividenden. Als sich die Lieferketten normalisierten und neu bestellte Schiffskapazität auf den Markt kam, kollabierten Frachtraten und Aktienkurs gemeinsam.","chars":282},{"p":"bubble-FRO","title":"Frontline — der Tanker-Superzyklus einer früheren Generation","text":"FRO.US · Tanker-Shipping\n\nFast zwei Jahrzehnte vor ZIM lieferte Frontline dasselbe Muster in der Öltanker-Schifffahrt: der China-Nachfrageboom der 2000er trieb Frachtraten und Dividende auf Rekordhöhen, gefolgt von einem strukturellen, jahrelangen Abwärtstrend, statt eines schnellen Crashs.","chars":265},{"p":"bubble-SBLK","title":"Star Bulk Carriers — Trockenfracht-Pendant zu ZIM","text":"SBLK.US · Bulk-Shipping\n\nDerselbe 2021-22-Fracht-Superzyklus wie bei ZIM, diesmal im Trockenfracht-Segment (Massengut statt Container) — der Rückgang fiel milder aus und war zum Zeitpunkt dieser Analyse noch nicht vollständig ausgestanden.","chars":214},{"p":"bubble-CTRA","title":"Coterra Energy — Energiepreisschock 2022 und schnelle Normalisierung","text":"CTRA.US · Öl & Gas (variable Dividende)\n\nDer russische Angriffskrieg auf die Ukraine trieb Energiepreise und variable Dividenden US-amerikanischer Öl-/Gasproduzenten 2022 auf Rekordniveaus. Coterras Rückgang war vergleichsweise mild und schnell — eine rasche Normalisierung statt eines strukturellen Zusammenbruchs.","chars":274},{"p":"bubble-DVN","title":"Devon Energy — derselbe Energieschock, tieferer Fall","text":"DVN.US · Öl & Gas (variable Dividende)\n\nGleicher Auslöser wie bei Coterra — der 2022er-Energiepreisschock und Devons aggressives variables-Dividenden-Programm — aber ein deutlich tieferer und länger anhaltender Kursrückgang, während Energiepreise in den Folgejahren weiter nachgaben.","chars":243},{"p":"bubble-FANG","title":"Diamondback Energy — der Energiezyklus zieht sich bis 2024","text":"FANG.US · Öl & Gas (variable Dividende)\n\nDer jüngste und späteste Dividenden-Höhepunkt in dieser Kohorte zeigt: das Muster \"variable Dividende folgt Rohstoffzyklus, dann Kurskorrektur\" ist kein einmaliges 2022er-Ereignis, sondern wiederholte sich noch 2024/25 im selben Sektor.","chars":236},{"p":"bubble-HCC","title":"Warrior Met Coal — Kokskohle vor dem Corona-Crash","text":"HCC.US · Kohle\n\nAnders als bei den Schifffahrts- und Energienamen war hier nicht die Normalisierung eines Superzyklus der Auslöser, sondern der plötzliche globale Industrienachfrage-Einbruch durch Covid-19 im März 2020 — derselbe Crash, den das Krisenarchiv als \"2020 — Corona-Crash\" dokumentiert, hier aus der Perspektive eines Kokskohle-Dividendenzahlers.","chars":341},{"p":"bubble-ARLP","title":"Alliance Resource Partners — der lange strukturelle Niedergang der US-Kohle","text":"ARLP.US · Kohle\n\nKein schneller Crash, sondern ein sechsjähriger struktureller Abwärtstrend: billiges Schiefergas verdrängte Kohle aus der US-Stromerzeugung, während ESG-Divestment-Druck zusätzlich belastete — bis der Covid-Nachfrageschock 2020 den finalen Tiefpunkt markierte.","chars":260},{"p":"bubble-CEIX","title":"CONSOL Energy — der mildeste Fall der Kohorte","text":"CEIX.US · Kohle\n\nDer jüngste und mildeste Dividenden-Rückgang in diesem Set — nützlich als Kontrast zu ARLPs neunzigprozentigem Einbruch: nicht jeder Rohstoff-Dividendenzyklus endet katastrophal, manche normalisieren sich einfach moderat.","chars":221},{"p":"bubble-SNOW","title":"Snowflake — größter Software-Börsengang aller Zeiten, dann Multiple-Kompression","text":"SNOW.US · IPO-Hype (2020)\n\nSnowflake ging im September 2020 als größter Software-Börsengang der Geschichte an die Börse, sogar Berkshire Hathaway zeichnete Aktien beim IPO. Der Höhepunkt fiel exakt mit dem breiten Wachstumsaktien-Top im November 2021 zusammen — klassische Multiple-Kompression, als die Zinsen 2022 stiegen.","chars":296},{"p":"bubble-PTON","title":"Peloton — der vollständigste Pandemie-Boom-Bust-Rundgang","text":"PTON.US · IPO-Hype (Corona-Boom)\n\nDer pandemiebedingte Heimfitness-Boom katapultierte Peloton auf Rekordbewertungen — der Höhepunkt lag im Januar 2021, noch bevor die ersten Impfstoffe breit verfügbar waren. Als sich das Leben normalisierte, verschwand der Rückenwind komplett: einer der vollständigsten Blase-zu-Totalverlust-Rundgänge dieser Ära (-98%).","chars":320},{"p":"bubble-ZM","title":"Zoom — die \"Bleib-zu-Hause\"-Aktie schlechthin","text":"ZM.US · IPO-Hype (Corona-Boom)\n\nZoom war die definierende Aktie des ersten Pandemiejahres — Höhepunkt im Oktober 2020, mitten im Lockdown, noch vor jedem Impfstoff. Die anschließende jahrelange Erosion zeigt, wie schwer ein pandemiegetriebener Nachfrageschub zu verteidigen war, sobald Homeoffice zur Normalität statt zur Ausnahme wurde.","chars":305},{"p":"bubble-DASH","title":"DoorDash — derselbe 2021er-Gipfel, aber vollständige Erholung","text":"DASH.US · IPO-Hype (2020)\n\nWie Snowflake toppte DoorDash im November 2021 am breiten Wachstumsaktien-Gipfel und erlitt einen tiefen Rückgang. Der entscheidende Unterschied: DoorDash erholte sich später vollständig — ein Beleg, dass nicht jede 2021er-IPO-Blasen-Aktie für immer unter ihrem Hoch bleibt.","chars":274},{"p":"bubble-ABNB","title":"Airbnb — Gipfel nur zwei Monate nach dem Börsengang","text":"ABNB.US · IPO-Hype (2020)\n\nEine der meistgehypten Neuemissionen 2020 — der Kurs erreichte sein Hoch bereits zwei Monate nach dem Listing, bevor der breitere Wachstumsaktien-Ausverkauf 2022 einsetzte.","chars":172},{"p":"bubble-COIN","title":"Coinbase — Direktplatzierung exakt am Krypto-Zyklushoch","text":"COIN.US · IPO-Hype (Krypto 2021)\n\nCoinbase ging per Direktplatzierung im April 2021 mitten in der Krypto-Hausse an die Börse, das Hoch fiel mit dem allgemeinen Krypto-Gipfel im November 2021 zusammen. Der Kurs brach durch Terra/Luna und den FTX-Kollaps 2022 um über 90% ein — erholte sich aber später als einziger der Krypto-nahen Namen in diesem Set vollständig.","chars":329},{"p":"bubble-HOOD","title":"Robinhood — Gipfel nur fünf Handelstage nach dem eigenen Börsengang","text":"HOOD.US · IPO-Hype (2021)\n\nRobinhood, die App der Meme-Aktien-Ära, erreichte ihr Hoch nur fünf Handelstage nach dem eigenen Börsengang — einer der schnellsten Blase-zu-Gipfel-Übergänge in diesem Archiv. Wie DoorDash und Coinbase erholte sich die Aktie später vollständig.","chars":244},{"p":"bubble-BYND","title":"Beyond Meat — der schnellste und vollständigste Rundgang","text":"BYND.US · IPO-Hype (2019)\n\nWeniger als drei Monate nach dem Börsengang 2019 erreichte die Plant-Based-Meat-Hype-Aktie bereits ihr Hoch — der schnellste Gipfel in diesem gesamten Archiv. Der jahrelange Niedergang endete bis 2025 praktisch im Totalverlust.","chars":227},{"p":"rocket-NVDA","title":"Nvidia — die Compute-Rallye Jahre vor dem KI-Hype","text":"NVDA.US · Halbleiter / KI-Compute\n\nDiese Rallye lief 2016-18, Jahre bevor generative KI zum Mainstream-Narrativ wurde (ChatGPT startete erst Ende 2022). Getrieben von Gaming-GPUs und den ersten Rechenzentrums-/Krypto-Mining-Wellen — ein Beleg, dass Nvidia schon lange vor der aktuellen KI-Mania eine \"Rakete\" war.","chars":278},{"p":"rocket-AMZN","title":"Amazon — die spekulative Dotcom-Kulmination","text":"AMZN.US · E-Commerce / Cloud\n\nNur drei Monate — die reine Blow-off-Top-Phase der Dotcom-Mania, unmittelbar vor dem Crash, den das Krisenarchiv als \"2000-2002 Dotcom-Crash\" dokumentiert. Selbst der spätere Billionen-Dollar-Gewinner Amazon durchlief eine wilde, kurzfristig unhaltbare Spekulationsphase auf dem Weg dorthin.","chars":291},{"p":"rocket-AAPL","title":"Apple — der iPhone/iPad-Superzyklus nach der Finanzkrise","text":"AAPL.US · Technologie / Konsumelektronik\n\nVom Tiefpunkt der Finanzkrise bis zum Höhepunkt der Steve-Jobs/frühen-Tim-Cook-Ära: iPhone- und iPad-Einführungen trieben eines der eindrucksvollsten Produktinnovations-Re-Ratings der Börsengeschichte.","chars":201},{"p":"rocket-TSLA","title":"Tesla — der Model-S-Beweis","text":"TSLA.US · Elektroautos\n\nDas Jahr der Model-S-Auslieferung: der erste echte Beweis, dass Tesla ein begehrenswertes Elektroauto in Serie bauen konnte. Diese Rallye etablierte Tesla erstmals als ernstzunehmenden Autohersteller in den Augen der Investoren, Jahre vor der Massenproduktions-Ära.","chars":265},{"p":"rocket-NFLX","title":"Netflix — die Erholung nach dem Qwikster-Debakel","text":"NFLX.US · Streaming\n\nNach dem katastrophalen Qwikster-Fiasko und der Preiserhöhung 2011 (Kurs brach damals um rund 80% ein) bewies Netflix, dass der Streaming-Pivot tatsächlich funktionierte. Ein Lehrstück: den Absturz gekauft, die Erholung geritten.","chars":229},{"p":"rocket-MSTR","title":"MicroStrategy — von Business-Intelligence zur Bitcoin-Treasury-Strategie","text":"MSTR.US · Bitcoin-Treasury\n\nStartet exakt am Covid-Crash-Tief. Im August 2020 verkündete CEO Michael Saylor die Umwandlung der Firmenbilanz in eine gehebelte Bitcoin-Wette — eine schläfrige Business-Intelligence-Softwarefirma wurde binnen Monaten zum liquiden Bitcoin-Proxy an der Börse.","chars":259},{"p":"rocket-MNST","title":"Monster Beverage — der unbeachtete Compounder","text":"MNST.US · Getränke\n\nDie Energy-Drink-Kategorie expandierte nach der Finanzkrise rasant, während kaum jemand an der Wall Street hinschaute. Eine der besten \"unter dem Radar\"-Compounder-Geschichten der Periode, Jahre bevor Monster ein bekannter Börsenliebling wurde.","chars":244},{"p":"rocket-CMG","title":"Chipotle — Fast-Casual-Boom nach der Finanzkrise","text":"CMG.US · Gastronomie\n\nDie Fast-Casual-Restaurantexpansion nach der Finanzkrise, Jahre vor der E.-coli-Krise 2015, die die Aktie später hart traf — ein gutes Beispiel, wie sich der Blick auf eine Rakete ändert, wenn man weiß, was danach kam.","chars":218},{"p":"rocket-PLTR","title":"Palantir — das aktuellste KI-Software-Re-Rating","text":"PLTR.US · KI-Analytics / Software\n\nDer jüngste Eintrag in diesem gesamten Archiv: Palantirs AIP-Plattform-Narrativ und die Aufnahme in den S&P 500 (September 2024) trieben eine der spektakulärsten Software-Re-Ratings der aktuellen KI-Ära.","chars":203},{"p":"rocket-AVGO","title":"Broadcom — die Rallye vor der eigenen Korrektur","text":"AVGO.US · Halbleiter\n\nBroadcoms KI-Netzwerktechnik- und Custom-Silicon-Geschäft trieb diese Rallye — auf derselben Aktie, die später den \"2026 — KI-/Halbleiter-Korrektur\"-Eintrag im Krisenarchiv auslöste. Rakete und späterer Rückschlag desselben Tickers, direkt vergleichbar.","chars":253},{"p":"rocket-BTC","title":"Bitcoin — einer der frühesten Manie-Zyklen","text":"BTC-USD.CC · Krypto\n\nJahre bevor Bitcoin Mainstream wurde: ein winziger, extrem illiquider Markt, noch vor dem Mt.-Gox-Kollaps 2014. Diese frühe Manie-Phase zeigt das Muster, das sich in jedem späteren Bitcoin-Zyklus wiederholte, in seiner reinsten, unverwässertsten Form.","chars":251},{"p":"rocket-SOL","title":"Solana — das erste \"Ethereum-Killer\"-Narrativ","text":"SOL-USD.CC · Krypto\n\nSolanas erste große Rallye, getragen vom \"Ethereum-Killer\"-Narrativ und enger Verflechtung mit Sam Bankman-Fried/Alameda — Monate bevor derselbe FTX-Kollaps (siehe Krisenarchiv, \"2022 — Krypto-Crash\") den Token fast in die Bedeutungslosigkeit stürzte.","chars":251},{"p":"decade-GSPC-INDX-1920","title":"S&P 500 — Die 1920er","text":"1927-12-30 bis 1929-12-31\n\nDie \"Roaring Twenties\": spekulativer Aktienboom auf Kredit (Margin-Trading), endet im Oktober 1929 mit dem Crash, der die Weltwirtschaftskrise einläutet. Diese Dekade ist in den Daten nur ab Ende 1927 erfasst.","chars":236},{"p":"decade-GSPC-INDX-1930","title":"S&P 500 — Die 1930er","text":"1930-01-01 bis 1939-12-31\n\nDie Große Depression: Der Dow verlor vom Hoch 1929 bis zum Tief 1932 rund 89%. Roosevelts New Deal ab 1933, aber die Erholung blieb fragil — viele Aktien erreichten ihr 1929er-Hoch erst nach Jahrzehnten wieder.","chars":237},{"p":"decade-GSPC-INDX-1940","title":"S&P 500 — Die 1940er","text":"1940-01-01 bis 1949-12-31\n\nDer Zweite Weltkrieg und seine Nachwirkungen: Kriegswirtschaft, Rationierung, dann die Nachkriegs-Inflation. Der Markt bewegte sich in dieser Dekade insgesamt seitwärts bis leicht positiv, geprägt von Unsicherheit.","chars":241},{"p":"decade-GSPC-INDX-1950","title":"S&P 500 — Die 1950er","text":"1950-01-01 bis 1959-12-31\n\nDer Nachkriegsboom: Wirtschaftswunder, Konsumgüter-Expansion, das \"Golden Age\" des amerikanischen Kapitalismus. Eisenhower-Ära, stabile Inflation, einer der ruhigsten und stärksten Bullenmärkte des Jahrhunderts.","chars":238},{"p":"decade-GSPC-INDX-1960","title":"S&P 500 — Die 1960er","text":"1960-01-01 bis 1969-12-31\n\nDie \"Nifty Fifty\"-Ära: Wachstumsaktien (IBM, GE, Coca-Cola u.a.) galten als \"kaufen und nie wieder verkaufen\". Endet mit zunehmender Inflation und dem Ende von Bretton Woods (Nixon beendet 1971 die Goldbindung).","chars":238},{"p":"decade-GSPC-INDX-1970","title":"S&P 500 — Die 1970er","text":"1970-01-01 bis 1979-12-31\n\nStagflation: Ölschocks (1973, 1979), zweistellige Inflation, hohe Arbeitslosigkeit gleichzeitig. Einer der schwierigsten Jahrzehnte für Aktien real betrachtet — nominal seitwärts, inflationsbereinigt ein Verlustjahrzehnt.","chars":248},{"p":"decade-GSPC-INDX-1980","title":"S&P 500 — Die 1980er","text":"1980-01-01 bis 1989-12-31\n\nVolckers Zinsschock beendet die Inflation, dann beginnt einer der stärksten Bullenmärkte der Geschichte unter Reagan — unterbrochen vom Schwarzen Montag 1987 (-22,6% an einem Tag), der die Dekade nicht stoppte.","chars":237},{"p":"decade-GSPC-INDX-1990","title":"S&P 500 — Die 1990er","text":"1990-01-01 bis 1999-12-31\n\nDer längste Bullenmarkt des 20. Jahrhunderts: Ende des Kalten Kriegs, Internetboom ab Mitte der Dekade, Clinton-Ära mit Haushaltsüberschüssen. Endet exakt am Dotcom-Gipfel im März 2000.","chars":212},{"p":"decade-GSPC-INDX-2000","title":"S&P 500 — Die 2000er","text":"2000-01-01 bis 2009-12-31\n\nDas \"verlorene Jahrzehnt\" für US-Aktien: Dotcom-Crash (2000-02) direkt gefolgt von der Globalen Finanzkrise (2008/09) — der S&P 500 beendete die Dekade nahe seinem Startwert, trotz zwischenzeitlicher Erholung 2003-07.","chars":244},{"p":"decade-GSPC-INDX-2010","title":"S&P 500 — Die 2010er","text":"2010-01-01 bis 2019-12-31\n\nDie längste Bullenmarkt-Phase der Neuzeit: beispiellose Notenbank-Liquidität (QE) nach der Finanzkrise, praktisch ohne größere Unterbrechung bis 2020 — nur kurze Rücksetzer wie 2011 (Euro-Schuldenkrise) und 2018 (Q4-Sell-off).","chars":253},{"p":"decade-GSPC-INDX-2020","title":"S&P 500 — Die 2020er","text":"2020-01-01 bis 2026-08-07\n\nCorona-Crash (schnellster Bärenmarkt der Geschichte, -34% in 33 Tagen) direkt gefolgt von der schnellsten Erholung dank massiver Fiskal-/Geldpolitik, dann der Zinserhöhungs-Bärenmarkt 2022 und der KI-getriebene Bullenmarkt 2023-26.","chars":258},{"p":"decade-DJI-INDX-1950","title":"Dow Jones Industrial — Die 1950er","text":"1950-01-01 bis 1959-12-31\n\nDer Nachkriegsboom: Wirtschaftswunder, Konsumgüter-Expansion, das \"Golden Age\" des amerikanischen Kapitalismus. Eisenhower-Ära, stabile Inflation, einer der ruhigsten und stärksten Bullenmärkte des Jahrhunderts.","chars":238},{"p":"decade-DJI-INDX-1960","title":"Dow Jones Industrial — Die 1960er","text":"1960-01-01 bis 1969-12-31\n\nDie \"Nifty Fifty\"-Ära: Wachstumsaktien (IBM, GE, Coca-Cola u.a.) galten als \"kaufen und nie wieder verkaufen\". Endet mit zunehmender Inflation und dem Ende von Bretton Woods (Nixon beendet 1971 die Goldbindung).","chars":238},{"p":"decade-DJI-INDX-1970","title":"Dow Jones Industrial — Die 1970er","text":"1970-01-01 bis 1979-12-31\n\nStagflation: Ölschocks (1973, 1979), zweistellige Inflation, hohe Arbeitslosigkeit gleichzeitig. Einer der schwierigsten Jahrzehnte für Aktien real betrachtet — nominal seitwärts, inflationsbereinigt ein Verlustjahrzehnt.","chars":248},{"p":"decade-DJI-INDX-1980","title":"Dow Jones Industrial — Die 1980er","text":"1980-01-01 bis 1989-12-31\n\nVolckers Zinsschock beendet die Inflation, dann beginnt einer der stärksten Bullenmärkte der Geschichte unter Reagan — unterbrochen vom Schwarzen Montag 1987 (-22,6% an einem Tag), der die Dekade nicht stoppte.","chars":237},{"p":"decade-DJI-INDX-1990","title":"Dow Jones Industrial — Die 1990er","text":"1990-01-01 bis 1999-12-31\n\nDer längste Bullenmarkt des 20. Jahrhunderts: Ende des Kalten Kriegs, Internetboom ab Mitte der Dekade, Clinton-Ära mit Haushaltsüberschüssen. Endet exakt am Dotcom-Gipfel im März 2000.","chars":212},{"p":"decade-DJI-INDX-2000","title":"Dow Jones Industrial — Die 2000er","text":"2000-01-01 bis 2009-12-31\n\nDas \"verlorene Jahrzehnt\" für US-Aktien: Dotcom-Crash (2000-02) direkt gefolgt von der Globalen Finanzkrise (2008/09) — der S&P 500 beendete die Dekade nahe seinem Startwert, trotz zwischenzeitlicher Erholung 2003-07.","chars":244},{"p":"decade-DJI-INDX-2010","title":"Dow Jones Industrial — Die 2010er","text":"2010-01-01 bis 2019-12-31\n\nDie längste Bullenmarkt-Phase der Neuzeit: beispiellose Notenbank-Liquidität (QE) nach der Finanzkrise, praktisch ohne größere Unterbrechung bis 2020 — nur kurze Rücksetzer wie 2011 (Euro-Schuldenkrise) und 2018 (Q4-Sell-off).","chars":253},{"p":"decade-DJI-INDX-2020","title":"Dow Jones Industrial — Die 2020er","text":"2020-01-01 bis 2026-08-07\n\nCorona-Crash (schnellster Bärenmarkt der Geschichte, -34% in 33 Tagen) direkt gefolgt von der schnellsten Erholung dank massiver Fiskal-/Geldpolitik, dann der Zinserhöhungs-Bärenmarkt 2022 und der KI-getriebene Bullenmarkt 2023-26.","chars":258},{"p":"inflation-GSPC-INDX","title":"S&P 500 — inflationsbereinigt (Kaufkraft von 2025)","text":"1927-12-30 bis 2026-08-07\n\nDerselbe Kursverlauf, aber auf die Kaufkraft von 2025 umgerechnet (US-CPI-U, Näherungswerte aus bekannten BLS-Ankerpunkten interpoliert — für exakte Analysen die offizielle BLS-Zeitreihe verwenden). Zeigt, wie viel von der nominalen Rendite tatsächlich reale Kaufkraft-Zunahme war und wie viel reine Geldentwertung ausglich — besonders sichtbar in den 1970er-Jahren (Stagflation: nominal fast seitwärts, real ein Verlustjahrzehnt).","chars":458},{"p":"inflation-DJI-INDX","title":"Dow Jones Industrial — inflationsbereinigt (Kaufkraft von 2025)","text":"1950-01-02 bis 2026-08-07\n\nDerselbe Kursverlauf, aber auf die Kaufkraft von 2025 umgerechnet (US-CPI-U, Näherungswerte aus bekannten BLS-Ankerpunkten interpoliert — für exakte Analysen die offizielle BLS-Zeitreihe verwenden). Zeigt, wie viel von der nominalen Rendite tatsächlich reale Kaufkraft-Zunahme war und wie viel reine Geldentwertung ausglich — besonders sichtbar in den 1970er-Jahren (Stagflation: nominal fast seitwärts, real ein Verlustjahrzehnt).","chars":458}]};
</script>
<script>
(function () {
  const entries = DATA.entries;
  const notes = DATA.notes;
  const stats = DATA.stats;

  // ---------- header stats ----------
  const statRow = document.getElementById('statRow');
  const fmtDate = (iso) => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('de-DE', {year:'numeric', month:'short', day:'2-digit'}) : '–';
  statRow.innerHTML = [
    ['Unique Charts', '<b>' + DATA.entries.length + '</b>'],
    ['Duplikate entfernt', '<b>' + stats.dupesRemoved + '</b>'],
    ['KI-analysiert', '<b>' + stats.analyzed + '</b> / ' + entries.length],
    ['Zeitraum', '<b>' + fmtDate(stats.dateMin) + ' – ' + fmtDate(stats.dateMax) + '</b>'],
    ['Datum aus Chart gelesen', '<b>' + stats.fromChart + '</b>'],
    ['Notizen', '<b>' + notes.length + '</b> Dokumente'],
  ].map(([k,v]) => '<span>' + k + ': ' + v + '</span>').join('');

  // ---------- color coding for index groups ----------
  function hashHue(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h % 360;
  }
  const groupColor = {};
  DATA.indexGroups.forEach(g => { groupColor[g] = hashHue(g); });
  function badgeStyle(group) {
    const hue = groupColor[group] ?? 0;
    return 'background: hsl(' + hue + ' 55% 92% / 1); color: hsl(' + hue + ' 45% 30% / 1);';
  }

  // ---------- filter state ----------
  const state = { q: '', groups: new Set(), types: new Set(), sort: 'chrono' };

  function count(field, value) {
    return entries.filter(e => e[field] === value).length;
  }

  // ---------- filter badge ----------
  const filterBadge = document.getElementById('filterBadge');
  function updateFilterBadge() {
    const n = state.groups.size + state.types.size;
    filterBadge.textContent = String(n);
    filterBadge.hidden = n === 0;
  }

  const indexChips = document.getElementById('indexChips');
  DATA.indexGroups.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.dataset.active = '0';
    btn.innerHTML = g + ' <span class="n">' + count('g', g) + '</span>';
    btn.addEventListener('click', () => {
      if (state.groups.has(g)) state.groups.delete(g); else state.groups.add(g);
      btn.dataset.active = state.groups.has(g) ? '1' : '0';
      updateFilterBadge();
      render();
    });
    indexChips.appendChild(btn);
  });

  const typeChips = document.getElementById('typeChips');
  DATA.chartTypes.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.dataset.active = '0';
    btn.innerHTML = t + ' <span class="n">' + count('c', t) + '</span>';
    btn.addEventListener('click', () => {
      if (state.types.has(t)) state.types.delete(t); else state.types.add(t);
      btn.dataset.active = state.types.has(t) ? '1' : '0';
      updateFilterBadge();
      render();
    });
    typeChips.appendChild(btn);
  });

  // ---------- filter drawer (the "burger menu" holding all chips) ----------
  const filterBtn = document.getElementById('filterBtn');
  const filterDrawer = document.getElementById('filterDrawer');
  const filterBackdrop = document.getElementById('filterBackdrop');
  const filterCloseBtn = document.getElementById('filterCloseBtn');
  const filterResetBtn = document.getElementById('filterResetBtn');

  function openFilterDrawer() {
    filterDrawer.classList.add('open');
    filterBackdrop.classList.add('open');
    filterDrawer.setAttribute('aria-hidden', 'false');
    filterBtn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }
  function closeFilterDrawer() {
    filterDrawer.classList.remove('open');
    filterBackdrop.classList.remove('open');
    filterDrawer.setAttribute('aria-hidden', 'true');
    filterBtn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }
  filterBtn.addEventListener('click', () => {
    filterDrawer.classList.contains('open') ? closeFilterDrawer() : openFilterDrawer();
  });
  filterCloseBtn.addEventListener('click', closeFilterDrawer);
  filterBackdrop.addEventListener('click', closeFilterDrawer);
  filterResetBtn.addEventListener('click', () => {
    state.groups.clear();
    state.types.clear();
    indexChips.querySelectorAll('.chip').forEach(c => c.dataset.active = '0');
    typeChips.querySelectorAll('.chip').forEach(c => c.dataset.active = '0');
    updateFilterBadge();
    render();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && filterDrawer.classList.contains('open')) closeFilterDrawer();
  });

  document.getElementById('searchBox').addEventListener('input', (e) => {
    state.q = e.target.value.trim().toLowerCase();
    render();
  });
  document.getElementById('sortSelect').addEventListener('change', (e) => {
    state.sort = e.target.value;
    render();
  });

  function filtered() {
    let list = entries;
    if (state.groups.size) list = list.filter(e => state.groups.has(e.g));
    if (state.types.size) list = list.filter(e => state.types.has(e.c));
    if (state.q) {
      const q = state.q;
      list = list.filter(e =>
        (e.t && e.t.toLowerCase().includes(q)) ||
        (e.co && e.co.toLowerCase().includes(q)) ||
        (e.f && e.f.toLowerCase().includes(q)) ||
        (e.g && e.g.toLowerCase().includes(q))
      );
    }
    list = list.slice();
    if (state.sort === 'chrono') list.sort((a,b) => (a.d||'9999').localeCompare(b.d||'9999') || a.t.localeCompare(b.t));
    else if (state.sort === 'chrono-desc') list.sort((a,b) => (b.d||'0000').localeCompare(a.d||'0000') || a.t.localeCompare(b.t));
    else if (state.sort === 'ticker') list.sort((a,b) => a.t.localeCompare(b.t));
    else if (state.sort === 'confidence') list.sort((a,b) => (b.conf ?? -1) - (a.conf ?? -1));
    return list;
  }

  let currentList = [];

  function monthName(m) {
    return ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][m];
  }

  function cardHtml(e, idx) {
    const srcClass = e.dsrc === 'chart' ? 'src-chart' : e.dsrc === 'folder' ? 'src-folder' : 'src-approx';
    const dateLabel = e.d ? (e.d.slice(8,10) + '.' + e.d.slice(5,7) + '.' + e.d.slice(0,4)) : 'ohne Datum';
    return '<div class="card" data-idx="' + idx + '">' +
      '<div class="thumb-wrap"><img loading="lazy" src="https://babybounce500.github.io/orbitron-charts-images/legends/img/' + e.h + '.jpg" alt="' + escapeHtml(e.t) + '"></div>' +
      '<div class="meta">' +
        '<div class="ticker">' + escapeHtml(e.t) + '</div>' +
        (e.co ? '<div class="company">' + escapeHtml(e.co) + '</div>' : '') +
        '<div class="row2">' +
          '<span class="badge" style="' + badgeStyle(e.g) + '">' + escapeHtml(e.g) + '</span>' +
          '<span class="date-tag ' + (e.dsrc==='approx'?'approx':'') + '"><span class="src-dot ' + srcClass + '"></span>' + dateLabel + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render() {
    currentList = filtered();
    const el = document.getElementById('view-charts');
    if (!currentList.length) {
      el.innerHTML = '<div class="empty-state">Keine Charts für diese Filter gefunden.</div>';
      return;
    }
    if (state.sort === 'chrono' || state.sort === 'chrono-desc') {
      let html = '';
      let curKey = null;
      let groupBuf = [];
      const flush = () => {
        if (!groupBuf.length) return;
        const [yr, mo, label] = curKey;
        html += '<div class="group-header"><span class="yr">' + yr + '</span><span class="mo">' + label + '</span><span class="cnt">' + groupBuf.length + ' Charts</span></div>';
        html += '<div class="grid">' + groupBuf.join('') + '</div>';
        groupBuf = [];
      };
      currentList.forEach((e, i) => {
        let key;
        if (e.d) {
          const yr = e.d.slice(0,4);
          const mo = Number(e.d.slice(5,7)) - 1;
          key = [yr, mo, monthName(mo) + ' ' + yr];
        } else {
          key = ['—', -1, 'Ohne Datum'];
        }
        const keyStr = key[0] + '-' + key[1];
        if (!curKey || (curKey[0]+'-'+curKey[1]) !== keyStr) { flush(); curKey = key; }
        groupBuf.push(cardHtml(e, entries.indexOf(e)));
      });
      flush();
      el.innerHTML = html;
    } else {
      el.innerHTML = '<div class="grid">' + currentList.map((e) => cardHtml(e, entries.indexOf(e))).join('') + '</div>';
    }
    el.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openLightbox(Number(card.dataset.idx)));
    });
  }

  // ---------- lightbox ----------
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbSide = document.getElementById('lbSide');
  let lbEntryIdx = -1;

  function currentFilteredIdxList() {
    return currentList.map(e => entries.indexOf(e));
  }

  function openLightbox(entryIdx) {
    lbEntryIdx = entryIdx;
    const e = entries[entryIdx];
    lbImg.src = 'https://babybounce500.github.io/orbitron-charts-images/legends/img/' + e.h + '.jpg';
    lbImg.alt = e.t;
    const srcLabel = { chart: 'aus Chart gelesen', folder: 'aus Ordnername', approx: 'ungefähr, aus Kontext' }[e.dsrc] || 'unbekannt';
    const confPct = e.conf != null ? Math.round(e.conf * 100) : null;
    lbSide.innerHTML =
      '<h2>' + escapeHtml(e.t) + '</h2>' +
      (e.co ? '<div class="sub">' + escapeHtml(e.co) + '</div>' : '<div class="sub">&nbsp;</div>') +
      field('Datum', (e.d ? fmtDate(e.d) : '–') + ' <span style="color:var(--text-faint)">(' + srcLabel + ')</span>') +
      field('Index / Gruppe', '<span class="badge" style="' + badgeStyle(e.g) + '">' + escapeHtml(e.g) + '</span>') +
      field('Chart-Typ', escapeHtml(e.c) + (e.ctf ? ' <span style="color:var(--text-faint)">(' + escapeHtml(e.ctf) + ')</span>' : '')) +
      (e.ac ? field('Asset-Klasse', escapeHtml(e.ac)) : '') +
      (confPct != null ? field('KI-Konfidenz', confPct + '%<div class="lb-conf-bar"><div class="lb-conf-fill" style="width:' + confPct + '%"></div></div>') : '') +
      (e.note ? field('Notiz (KI)', escapeHtml(e.note)) : '') +
      (e.dupes ? field('Duplikate im Archiv', e.dupes + 'x an anderer Stelle gefunden') : '') +
      field('Originalpfad', '<div class="mono">' + escapeHtml(e.p) + '</div>');
  }
  function field(k, v) {
    return '<div class="lb-field"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    setTimeout(() => { lightbox.hidden = true; }, 220); // match .lightbox opacity transition
  }
  function step(dir) {
    const idxList = currentFilteredIdxList();
    const pos = idxList.indexOf(lbEntryIdx);
    if (pos === -1) return;
    const next = (pos + dir + idxList.length) % idxList.length;
    openLightbox(idxList[next]);
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => step(-1));
  document.getElementById('lbNext').addEventListener('click', () => step(1));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (lightbox.hidden) return;
    if (e.key === 'Escape' && !document.fullscreenElement) closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
    if (e.key.toLowerCase() === 'f') toggleFullscreen();
  });

  // ---------- lightbox fullscreen ----------
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (lightbox.requestFullscreen) lightbox.requestFullscreen().catch(() => {});
  }
  document.getElementById('lbFullscreen').addEventListener('click', toggleFullscreen);
  lbImg.addEventListener('dblclick', toggleFullscreen);

  const _origOpen = openLightbox;
  openLightbox = function(idx) {
    lightbox.hidden = false;
    _origOpen(idx);
    requestAnimationFrame(() => requestAnimationFrame(() => lightbox.classList.add('open')));
  };

  // ---------- notes tab ----------
  const notesView = document.getElementById('view-notes');
  notesView.innerHTML = notes.map((n, i) => {
    const kb = (n.chars / 1024).toFixed(0);
    return '<div class="note-card">' +
      '<div class="note-head" data-i="' + i + '">' +
        '<div><div class="note-title">' + escapeHtml(n.title) + '</div><div class="note-path">' + escapeHtml(n.p) + '</div></div>' +
        '<div class="note-chars">' + kb + ' KB</div>' +
      '</div>' +
      '<div class="note-body" id="note-body-' + i + '" hidden>' + escapeHtml(n.text.slice(0, 20000)) + (n.text.length > 20000 ? '\\n\\n[… gekürzt, ' + kb + ' KB gesamt …]' : '') + '</div>' +
    '</div>';
  }).join('');
  notesView.querySelectorAll('.note-head').forEach(h => {
    h.addEventListener('click', () => {
      const body = document.getElementById('note-body-' + h.dataset.i);
      body.hidden = !body.hidden;
    });
  });

  // ---------- stats tab ----------
  const statsView = document.getElementById('view-stats');
  function bars(title, field) {
    const counts = {};
    entries.forEach(e => { const v = e[field] || '–'; counts[v] = (counts[v]||0)+1; });
    const max = Math.max(...Object.values(counts));
    const rows = Object.entries(counts).sort((a,b) => b[1]-a[1]).map(([k,v]) =>
      '<div class="bar-row"><div class="bar-label">' + escapeHtml(k) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + (v/max*100) + '%"></div></div><div class="bar-val">' + v + '</div></div>'
    ).join('');
    return '<div class="stat-block"><h3>' + title + '</h3>' + rows + '</div>';
  }
  function yearBars() {
    const counts = {};
    entries.forEach(e => { const y = e.d ? e.d.slice(0,4) : 'ohne Datum'; counts[y] = (counts[y]||0)+1; });
    const max = Math.max(...Object.values(counts));
    const years = Object.keys(counts).sort();
    const rows = years.map(y =>
      '<div class="bar-row"><div class="bar-label">' + y + '</div><div class="bar-track"><div class="bar-fill" style="width:' + (counts[y]/max*100) + '%"></div></div><div class="bar-val">' + counts[y] + '</div></div>'
    ).join('');
    return '<div class="stat-block"><h3>Charts pro Jahr</h3>' + rows + '</div>';
  }
  statsView.innerHTML =
    yearBars() +
    bars('Index / Gruppe', 'g') +
    bars('Chart-Typ', 'c') +
    bars('Datenquelle des Datums', 'dsrc');

  // ---------- tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('view-charts').hidden = tab !== 'charts';
      document.getElementById('view-notes').hidden = tab !== 'notes';
      document.getElementById('view-stats').hidden = tab !== 'stats';
      document.getElementById('chartsControls').style.display = tab === 'charts' ? '' : 'none';
      if (tab !== 'charts') closeFilterDrawer();
    });
  });

  render();
})();
</script>
</body>
</html>
